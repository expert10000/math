volume: III
convention: exp(-2*pi*i*x_dot_xi)
forward: "F[f](xi) = integral f(x) exp(-2*pi*i*x·xi) dx"
inverse: "f(x) = integral F[f](xi) exp(2*pi*i*x·xi) dxi"
identities:
  derivative: "F[partial_j f] = 2*pi*i*xi_j*F[f]"
  laplacian: "F[Delta f] = -4*pi^2*|xi|^2*F[f]"
  negative_laplacian: "F[-Delta f] = 4*pi^2*|xi|^2*F[f]"
  delta_zero: "F[delta_0] = 1"
  constant_one: "F[1] = delta_0"
  gaussian: "F[exp(-pi*|x|^2)] = exp(-pi*|xi|^2)"
  heat_kernel: "F[K_t] = exp(-4*pi^2*t*|xi|^2)"
  convolution: "F[f*g] = F[f]F[g]"
periodic_series:
  interval: "[-pi,pi]"
  real_coefficients: "a_n=(1/pi)int f cos(nx); b_n=(1/pi)int f sin(nx)"
