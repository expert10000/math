<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cup product as pullback of the cross product along the diagonal</title>
  <desc id="desc">Cup product as pullback of the cross product along the diagonal teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h { font-size:32px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:19px; }
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:16; }
      .soft { fill:#f4f6f8; stroke:#555; stroke-width:2; rx:16; }
      .accent { fill:#eef5ff; stroke:#244b74; stroke-width:2; rx:16; }
      .line { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  
  <text class="t h" x="55" y="55">Cup product = diagonal pullback of cross product</text>
  <rect class="accent" x="100" y="190" width="250" height="120"/>
  <text class="t m" x="185" y="245">X</text>
  <text class="t s" x="145" y="280">a,b ∈ H*(X)</text>

  <rect class="soft" x="475" y="135" width="330" height="220"/>
  <text class="t m" x="580" y="195">X × X</text>
  <text class="t s" x="525" y="245">a × b ∈ H*(X×X)</text>
  <text class="t s" x="520" y="300">cross product</text>

  <rect class="box" x="875" y="190" width="250" height="120"/>
  <text class="t m" x="935" y="245">H*(X)</text>
  <text class="t s" x="915" y="280">a ∪ b = Δ*(a×b)</text>

  <path class="line" d="M350 250 L460 250"/>
  <text class="t s" x="370" y="225">Δ:x↦(x,x)</text>
  <path class="line" d="M805 250 L860 250"/>
  <text class="t s" x="805" y="225">Δ*</text>

  <rect class="soft" x="290" y="470" width="620" height="120"/>
  <text class="t m" x="370" y="520">graded multiplication</text>
  <text class="t m" x="360" y="560">Hᵖ × Hᑫ → Hᵖ⁺ᑫ</text>

</svg>