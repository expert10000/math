<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Torus and wedge with equal Betti numbers but different cup products</title>
  <desc id="desc">Torus and wedge with equal Betti numbers but different cup products teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h { font-size:32px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:19px; }
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:16; }
      .soft { fill:#f4f6f8; stroke:#555; stroke-width:2; rx:16; }
      .accent { fill:#eef5ff; stroke:#244b74; stroke-width:2; rx:16; }
      .line { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  
  <text class="t h" x="55" y="55">Same Betti numbers, different cohomology rings</text>
  <rect class="accent" x="70" y="120" width="500" height="490"/>
  <text class="t m" x="250" y="165">T²</text>
  <ellipse cx="320" cy="285" rx="150" ry="75" fill="none" stroke="#244b74" stroke-width="12"/>
  <ellipse cx="320" cy="285" rx="55" ry="28" fill="white" stroke="#244b74" stroke-width="6"/>
  <text class="t s" x="155" y="410">b₀=1, b₁=2, b₂=1</text>
  <text class="t m" x="160" y="475">a ∪ b ≠ 0</text>
  <text class="t s" x="145" y="525">top class generated multiplicatively</text>

  <rect class="soft" x="630" y="120" width="500" height="490"/>
  <text class="t m" x="805" y="165">S¹ ∨ S¹ ∨ S²</text>
  <circle cx="790" cy="285" r="70" fill="none" stroke="#555" stroke-width="8"/>
  <circle cx="930" cy="285" r="70" fill="none" stroke="#555" stroke-width="8"/>
  <circle cx="860" cy="285" r="7" fill="#111"/>
  <circle cx="860" cy="285" r="120" fill="none" stroke="#999" stroke-width="4" stroke-dasharray="10,8"/>
  <text class="t s" x="715" y="410">b₀=1, b₁=2, b₂=1</text>
  <text class="t m" x="735" y="475">mixed cup products = 0</text>
  <text class="t s" x="720" y="525">same groups, different ring</text>

</svg>