<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Geometric intersection and the middle-dimensional pairing</title>
<desc id="desc">Two oriented surfaces intersect transversely in a four-manifold; signed points are evaluated by the cup-product intersection form.</desc>
<rect x="65" y="65" width="1070" height="590" rx="28" fill="white" stroke="black" stroke-width="4"/>
<ellipse cx="470" cy="390" rx="290" ry="120" fill="none" stroke="black" stroke-width="6"/>
<ellipse cx="690" cy="370" rx="120" ry="270" fill="none" stroke="black" stroke-width="6"/>
<circle cx="595" cy="370" r="12" fill="black"/>
<circle cx="655" cy="435" r="12" fill="black"/>
<text x="170" y="140" font-size="32">PD(A) cup PD(B), evaluated on [M]</text>
<text x="775" y="390" font-size="30">signed intersections</text>
<text x="265" y="615" font-size="31">Q_M(alpha,beta) = A · B</text>
</svg>
