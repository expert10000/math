<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Standard four-manifold intersection forms</title>
<desc id="desc">Comparison of the CP2, orientation-reversed CP2, and hyperbolic S2 times S2 intersection matrices with signature and parity.</desc>
<rect x="60" y="70" width="1080" height="580" rx="28" fill="white" stroke="black" stroke-width="4"/>
<text x="125" y="150" font-size="34">CP^2</text><text x="125" y="215" font-size="40">[ 1 ]</text><text x="105" y="275" font-size="27">odd, definite, sigma=1</text>
<text x="475" y="150" font-size="34">-CP^2</text><text x="480" y="215" font-size="40">[ -1 ]</text><text x="445" y="275" font-size="27">odd, definite, sigma=-1</text>
<text x="825" y="150" font-size="34">S^2 x S^2</text><text x="850" y="215" font-size="36">[0 1; 1 0]</text><text x="790" y="275" font-size="27">even, indefinite, sigma=0</text>
<path d="M150 420 L1020 420" stroke="black" stroke-width="4"/>
<text x="165" y="500" font-size="30">orientation reversal: Q -> -Q</text>
<text x="630" y="500" font-size="30">connected sum: Q -> orthogonal sum</text>
<text x="340" y="590" font-size="30">unimodular integral lattice from Poincare duality</text>
</svg>
