<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Poincare duality degree pairing and intersection</title><desc id="desc">Complementary cohomology classes cup to top degree and evaluate on the fundamental class; transverse dual cycles intersect.</desc>
<rect x="70" y="70" width="1060" height="580" rx="28" fill="white" stroke="black" stroke-width="4"/>
<text x="135" y="160" font-size="31">H^k(M) x H^{n-k}(M)</text><text x="520" y="160" font-size="31">cup</text><text x="690" y="160" font-size="31">H^n(M)</text><text x="920" y="160" font-size="31">eval [M]</text>
<ellipse cx="600" cy="440" rx="360" ry="135" fill="none" stroke="black" stroke-width="5"/>
<path d="M330 480 C470 295 720 580 870 360" fill="none" stroke="black" stroke-width="6"/>
<path d="M380 355 C525 560 710 315 835 495" fill="none" stroke="black" stroke-width="6"/>
<circle cx="610" cy="430" r="12" fill="black"/>
<text x="390" y="620" font-size="29">cup product = transverse intersection</text>
</svg>