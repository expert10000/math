<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Euler obstruction and zero locus</title><desc id="desc">The zero section pulls back the Thom class; a transverse section has a zero set dual to the Euler class.</desc>
<rect x="80" y="80" width="1040" height="560" rx="28" fill="white" stroke="black" stroke-width="4"/>
<text x="130" y="175" font-size="34">u_E</text><text x="315" y="175" font-size="31">pull back by zero section</text><text x="790" y="175" font-size="34">e(E)</text>
<path d="M220 160 L295 160" stroke="black" stroke-width="5"/><polygon points="295,160 270,145 270,175" fill="black"/>
<path d="M690 160 L770 160" stroke="black" stroke-width="5"/><polygon points="770,160 745,145 745,175" fill="black"/>
<path d="M170 470 C360 370 760 550 1030 410" fill="none" stroke="black" stroke-width="5"/>
<g fill="black"><circle cx="360" cy="420" r="13"/><circle cx="650" cy="470" r="13"/><circle cx="900" cy="445" r="13"/></g>
<text x="180" y="560" font-size="29">transverse zeros represent PD(e(E))</text>
</svg>