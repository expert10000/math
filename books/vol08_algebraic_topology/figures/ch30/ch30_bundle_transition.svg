<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Local trivializations, transition functions, and Mobius twisting</title>
  <desc id="desc">Local trivializations, transition functions, and Mobius twisting teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h { font-size:32px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:19px; }
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:16; }
      .soft { fill:#f4f6f8; stroke:#555; stroke-width:2; rx:16; }
      .accent { fill:#eef5ff; stroke:#244b74; stroke-width:2; rx:16; }
      .line { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  
  <text class="t h" x="55" y="55">Vector bundle: local products + transition data</text>
  <path d="M100 520 C260 450 410 470 560 520 S860 590 1100 510" stroke="#244b74" stroke-width="8" fill="none"/>
  <text class="t m" x="525" y="625">base X</text>

  <rect class="accent" x="110" y="135" width="350" height="260"/>
  <text class="t m" x="245" y="175">Uᵢ × Rᵏ</text>
  <line x1="180" y1="350" x2="180" y2="220" stroke="#333" stroke-width="3"/>
  <line x1="270" y1="350" x2="270" y2="220" stroke="#333" stroke-width="3"/>
  <line x1="360" y1="350" x2="360" y2="220" stroke="#333" stroke-width="3"/>

  <rect class="soft" x="740" y="135" width="350" height="260"/>
  <text class="t m" x="870" y="175">Uⱼ × Rᵏ</text>
  <line x1="810" y1="350" x2="810" y2="220" stroke="#333" stroke-width="3"/>
  <line x1="900" y1="350" x2="900" y2="220" stroke="#333" stroke-width="3"/>
  <line x1="990" y1="350" x2="990" y2="220" stroke="#333" stroke-width="3"/>

  <path class="line" d="M465 265 L725 265"/>
  <text class="t m" x="515" y="230">gᵢⱼ(x) ∈ GLₖ</text>
  <text class="t s" x="500" y="300">change of fiber coordinates</text>

  <rect class="box" x="430" y="420" width="340" height="110"/>
  <text class="t s" x="470" y="462">Möbius line bundle:</text>
  <text class="t m" x="470" y="502">(0,v) ~ (1,−v)</text>

</svg>