<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Clutching two trivial hemisphere bundles along the equator</title>
  <desc id="desc">Clutching two trivial hemisphere bundles along the equator teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h { font-size:32px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:19px; }
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:16; }
      .soft { fill:#f4f6f8; stroke:#555; stroke-width:2; rx:16; }
      .accent { fill:#eef5ff; stroke:#244b74; stroke-width:2; rx:16; }
      .line { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  
  <text class="t h" x="55" y="55">Clutching: build a bundle on Sⁿ from the equator</text>

  <path d="M260 180 A190 190 0 0 1 640 180 L450 390 Z" fill="#eef5ff" stroke="#244b74" stroke-width="3"/>
  <path d="M260 180 A190 190 0 0 0 640 180 L450 390 Z" fill="#f4f6f8" stroke="#555" stroke-width="3"/>
  <line x1="260" y1="180" x2="640" y2="180" stroke="#111" stroke-width="5"/>
  <text class="t m" x="385" y="125">Dⁿ₊</text>
  <text class="t m" x="385" y="350">Dⁿ₋</text>
  <text class="t s" x="330" y="210">equator Sⁿ⁻¹</text>

  <rect class="accent" x="760" y="125" width="350" height="120"/>
  <text class="t m" x="815" y="175">Dⁿ₊ × Rᵏ</text>
  <text class="t s" x="815" y="210">trivial bundle</text>

  <rect class="soft" x="760" y="360" width="350" height="120"/>
  <text class="t m" x="815" y="410">Dⁿ₋ × Rᵏ</text>
  <text class="t s" x="815" y="445">trivial bundle</text>

  <path class="line" d="M690 185 L745 185"/>
  <path class="line" d="M690 390 L745 415"/>
  <path class="line" d="M935 260 L935 345"/>
  <text class="t m" x="965" y="305">g:Sⁿ⁻¹→O(k)</text>
  <text class="t s" x="800" y="555">homotopy class of g controls the global twist</text>

</svg>