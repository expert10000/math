<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chains, cochains, boundary, coboundary, and evaluation</title>
  <desc id="desc">Chains, cochains, boundary, coboundary, and evaluation teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
