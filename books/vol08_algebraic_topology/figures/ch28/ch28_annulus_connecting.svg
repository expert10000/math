<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Annulus pair, deformation retract, and cohomology exact sequence</title>
  <desc id="desc">Annulus pair, deformation retract, and cohomology exact sequence teaching diagram for Volume VIII Algebraic Topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h { font-size:32px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:19px; }
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:16; }
      .soft { fill:#f4f6f8; stroke:#555; stroke-width:2; rx:16; }
      .accent { fill:#eef5ff; stroke:#244b74; stroke-width:2; rx:16; }
      .line { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:2; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="white"/>
  
  <text class="t h" x="55" y="55">Annulus pair (X,A) and the connecting picture</text>
  <ellipse cx="285" cy="300" rx="190" ry="135" fill="#eef5ff" stroke="#244b74" stroke-width="3"/>
  <ellipse cx="285" cy="300" rx="105" ry="70" fill="white" stroke="#244b74" stroke-width="3"/>
  <ellipse cx="285" cy="300" rx="190" ry="135" fill="none" stroke="#111" stroke-width="5"/>
  <text class="t m" x="105" y="470">A = boundary circle</text>
  <text class="t m" x="230" y="300">X</text>
  <path class="line" d="M285 300 L285 175"/>
  <text class="t s" x="305" y="230">deformation retract</text>

  <rect class="soft" x="560" y="150" width="570" height="360"/>
  <text class="t m" x="610" y="205">Cohomology LES fragment</text>
  <text class="t m" x="610" y="275">H¹(X;G) → H¹(A;G) → H²(X,A;G)</text>
  <text class="t s" x="610" y="325">restriction is an isomorphism</text>
  <text class="t s" x="610" y="365">because A ↪ X is a homotopy equivalence</text>
  <text class="t s" x="610" y="425">therefore H*(X,A;G) = 0</text>

  <path class="line" d="M470 300 L545 300"/>
  <text class="t s" x="455" y="275">topology → algebra</text>

</svg>