<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Graph diagonal intersection interpretation of Lefschetz theory</title>
<desc id="desc">The graph of a self-map meets the diagonal at fixed points; the signed intersection equals the Lefschetz number.</desc>
<rect x="65" y="65" width="1070" height="590" rx="28" fill="white" stroke="black" stroke-width="4"/>
<path d="M170 545 L970 145" stroke="black" stroke-width="7"/>
<path d="M165 500 C350 150 700 590 1010 250" fill="none" stroke="black" stroke-width="7"/>
<circle cx="375" cy="442" r="13" fill="black"/><circle cx="760" cy="250" r="13" fill="black"/>
<text x="850" y="170" font-size="31">Delta</text><text x="900" y="330" font-size="31">Gamma_f</text>
<text x="160" y="125" font-size="31">Gamma_f intersects Delta exactly at fixed points</text>
<text x="250" y="625" font-size="31">Gamma_f · Delta = L(f)</text>
</svg>
