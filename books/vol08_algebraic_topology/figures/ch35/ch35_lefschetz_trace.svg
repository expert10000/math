<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Lefschetz trace formula and fixed-point implication</title>
<desc id="desc">Alternating traces on homology form the Lefschetz number; nonzero Lefschetz number forces a fixed point.</desc>
<rect x="65" y="65" width="1070" height="590" rx="28" fill="white" stroke="black" stroke-width="4"/>
<text x="130" y="175" font-size="33">H_k(X) -- f_* --> H_k(X)</text>
<text x="130" y="285" font-size="34">L(f) = sum (-1)^k tr(f_* | H_k)</text>
<path d="M350 350 L350 480" stroke="black" stroke-width="6"/><polygon points="350,500 330,465 370,465" fill="black"/>
<text x="145" y="565" font-size="36">L(f) != 0</text>
<path d="M420 545 L680 545" stroke="black" stroke-width="6"/><polygon points="700,545 665,525 665,565" fill="black"/>
<text x="735" y="565" font-size="36">fixed point</text>
</svg>
